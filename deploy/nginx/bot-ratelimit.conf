# Đặt vào /etc/nginx/conf.d/bot-ratelimit.conf (ngữ cảnh http, nginx tự nạp).
# Giới hạn theo IP: chặn spam/flood nhẹ mà không ảnh hưởng người dùng bình thường.
limit_req_zone  $binary_remote_addr zone=bot_req:10m   rate=10r/s;
limit_req_zone  $binary_remote_addr zone=bot_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=bot_conn:10m;
