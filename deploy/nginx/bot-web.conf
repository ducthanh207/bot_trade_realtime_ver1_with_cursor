# /etc/nginx/sites-available/bot-web — reverse proxy HTTPS → Flask 127.0.0.1:5000
# Cần: deploy/nginx/bot-ratelimit.conf trong /etc/nginx/conf.d/, chứng chỉ certbot, file /etc/nginx/.htpasswd
# Đổi roadtopeace.duckdns.org nếu dùng tên miền khác.

server {
    listen 80;
    server_name roadtopeace.duckdns.org;
    # Certbot gia hạn chứng chỉ qua cổng 80
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name roadtopeace.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/roadtopeace.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roadtopeace.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # Kết nối chậm / request lớn bất thường → cắt sớm (chống slowloris, upload rác)
    client_max_body_size   1m;
    client_body_timeout    10s;
    client_header_timeout  10s;
    keepalive_timeout      30s;
    send_timeout           30s;

    # Giới hạn mỗi IP: 10 request/giây (dư 40 cho lúc mở trang), tối đa 20 kết nối cùng lúc
    limit_req   zone=bot_req burst=40 nodelay;
    limit_conn  bot_conn 20;
    limit_req_status  429;
    limit_conn_status 429;

    # Header bảo mật
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Lớp mật khẩu thứ nhất cho toàn bộ web (trang paper chưa có đăng nhập riêng)
    auth_basic           "Bot";
    auth_basic_user_file /etc/nginx/.htpasswd;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;

    # Trang đăng nhập /live: chậm hơn nhiều (chống dò mật khẩu)
    location = /live/login {
        limit_req zone=bot_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
    }

    location /static/ {
        expires 10m;
        proxy_pass http://127.0.0.1:5000;
    }

    # Chặn các đường dẫn bot quét lỗ hổng hay thử
    location ~* (\.env|\.git|wp-admin|wp-login|phpmyadmin|\.php$) { return 444; }

    location / {
        proxy_pass http://127.0.0.1:5000;
    }
}
