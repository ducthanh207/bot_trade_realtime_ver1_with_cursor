{# [2026-11-01] Khung backtest dùng chung cho Paper 1–5. Cần biến bt_slot (1–5) và bt_api ("/api/paper", "/api/paper2"...). #}
<div class="backtest-panel">
  <span class="backtest-title">Backtest lịch sử PP{{ bt_slot }} — phát lại từng phút đúng logic bot live (cùng tham số .env, chỉ nến đã đóng). Chỉ xem, không đổi paper thật.</span>
  <label>Cặp</label>
  <input type="text" id="btSymbol" value="" placeholder="BTCUSDT" style="width:100px">
  <label>Từ ngày</label>
  <input type="date" id="btStartDate">
  <label>Đến ngày</label>
  <input type="date" id="btEndDate">
  <label>Vốn ban đầu</label>
  <input type="number" id="btCapital" value="1000" min="1" step="1">
  <button type="button" id="btnBacktest">Chạy backtest</button>
  <button type="button" id="btnBtReopen" style="display:none">Xem kết quả</button>
  <span id="backtestResult"></span>
  <div id="backtestTrades" style="width:100%; display:none; max-height:320px; overflow:auto;"></div>
</div>
<div class="bt-modal" id="btModal" role="dialog" aria-modal="true" aria-labelledby="btModalTitle">
  <div class="bt-box">
    <div class="bt-head">
      <h3 id="btModalTitle">Kết quả backtest</h3>
      <a class="bt-xlsx" id="btXlsx" href="#" download>Xuất Excel</a>
      <button type="button" id="btClose">Đóng</button>
    </div>
    <div class="bt-chart-wrap"><canvas id="btChart"></canvas><div id="btTip"></div></div>
    <div class="bt-stats" id="btStats"></div>
    <div class="bt-reasons" id="btReasons"></div>
  </div>
</div>
<style>
.backtest-panel { background:#1a1a2e; border:1px solid #334; border-radius:6px; padding:12px 16px; margin:8px 0 0 0;
  display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
.backtest-panel label { color:#aaa; font-size:0.85em; white-space:nowrap; }
.backtest-panel input[type="date"], .backtest-panel input[type="number"], .backtest-panel input[type="text"] {
  background:#111; color:#eee; border:1px solid #445; border-radius:4px; padding:4px 8px; font-size:0.85em; width:130px; }
.backtest-panel input[type="number"] { width:90px; }
#btnBacktest { background:#5533aa; color:#fff; border:none; border-radius:4px; padding:6px 14px; cursor:pointer; font-size:0.85em; }
#btnBacktest:hover { background:#7755cc; }
#btnBacktest:disabled { background:#444; cursor:not-allowed; }
#btnBtReopen { background:#264; color:#fff; border:none; border-radius:4px; padding:6px 12px; cursor:pointer; font-size:0.85em; }
/* [2026-11-07] Popup kết quả backtest */
.bt-modal { position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:9999; display:none; align-items:center; justify-content:center; padding:16px; }
.bt-modal.open { display:flex; }
.bt-box { background:#14142a; border:1px solid #446; border-radius:8px; width:min(960px,100%); max-height:92vh; overflow:auto; padding:16px 18px; color:#dde; }
.bt-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
.bt-head h3 { margin:0; font-size:1.05em; color:#b9f; flex:1; min-width:200px; }
.bt-head button, .bt-head a { background:#334; color:#fff; border:none; border-radius:4px; padding:6px 12px; cursor:pointer; font-size:0.85em; text-decoration:none; }
.bt-head a.bt-xlsx { background:#1d6f42; }
.bt-chart-wrap { position:relative; background:#0d0d1c; border:1px solid #2a2a44; border-radius:6px; }
#btChart { display:block; width:100%; height:300px; }
#btTip { position:absolute; pointer-events:none; background:#000c; color:#fff; font-size:0.78em; padding:4px 7px; border-radius:4px; display:none; white-space:nowrap; }
.bt-stats { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:8px; margin-top:12px; }
.bt-stat { background:#1c1c36; border-radius:6px; padding:7px 10px; }
.bt-stat .k { color:#99a; font-size:0.75em; }
.bt-stat .v { font-size:1.02em; font-weight:bold; margin-top:2px; }
.bt-reasons { margin-top:10px; font-size:0.8em; color:#aab; }
#backtestResult { font-size:0.82em; color:#9cf; margin-left:6px; flex:1; min-width:200px; }
.backtest-title { color:#9966ff; font-weight:bold; font-size:0.88em; width:100%; margin-bottom:2px; }
#backtestTrades table { width:100%; border-collapse:collapse; font-size:0.78em; }
#backtestTrades th, #backtestTrades td { border-bottom:1px solid #2a2a40; padding:3px 6px; text-align:right; white-space:nowrap; }
#backtestTrades th { color:#aaa; position:sticky; top:0; background:#1a1a2e; }
</style>
<script>
(function() {
  var API = "{{ bt_api }}";
  var today = new Date();
  var past = new Date(today); past.setDate(past.getDate() - 30);
  function fmt(d) { return d.toISOString().slice(0, 10); }
  function $(id) { return document.getElementById(id); }
  $("btEndDate").value = fmt(today);
  $("btStartDate").value = fmt(past);
  function t(v) { return v ? String(v).replace("T", " ").slice(0, 16) : ""; }
  function n(v, d) { return (v === null || v === undefined) ? "" : Number(v).toFixed(d); }

  function showTrades(trades) {
    var box = $("backtestTrades");
    if (!trades || !trades.length) { box.style.display = "none"; return; }
    var rows = trades.slice().reverse().map(function(x) {
      var c = x.profit >= 0 ? "#6c6" : "#f66";
      return "<tr><td>" + x.side + "</td><td>" + t(x.entry_time) + "</td><td>" + n(x.entry_price, 2) +
        "</td><td>" + t(x.exit_time) + "</td><td>" + n(x.exit_price, 2) + "</td><td style='color:" + c + "'>" +
        n(x.profit, 2) + "</td><td>" + n(x.capital_after, 2) + "</td><td>" + x.exit_reason + (x.cycle ? " · " + x.cycle + (x.cycle_wide ? " (nới)" : "") : "") + "</td></tr>";
    }).join("");
    box.innerHTML = "<table><tr><th>Side</th><th>Vào lúc</th><th>Giá vào</th><th>Ra lúc</th><th>Giá ra</th>" +
      "<th>Profit</th><th>Cap After</th><th>Reason</th></tr>" + rows + "</table>";
    box.style.display = "block";
  }

  // ---------- [2026-11-07] Popup: biểu đồ vốn theo thời gian + thống kê + xuất Excel ----------
  var last = null;  // {d, jobId}
  function ts(v) { return new Date(String(v).replace(" ", "T")).getTime(); }
  function vn(t, n) { return new Date(t + 7 * 3600e3).toISOString().slice(0, n).replace("T", " "); }  // giờ VN
  function money(v) { return (v >= 0 ? "+" : "") + Number(v).toFixed(2); }

  function stats(d) {
    var tr = d.trades || [], cap0 = Number(d.initial_capital || 0);
    var net = tr.map(function(t) { return Number(t.profit || 0) - Number(t.fee_in || 0); });
    var w = net.filter(function(x) { return x > 0; }), l = net.filter(function(x) { return x <= 0; });
    var sum = function(a) { return a.reduce(function(s, x) { return s + x; }, 0); };
    var streak = 0, cur = 0;
    net.forEach(function(x) { cur = x <= 0 ? cur + 1 : 0; streak = Math.max(streak, cur); });
    var longs = tr.filter(function(t) { return t.side === "LONG"; }).length;
    var ret = cap0 ? (d.final_balance / cap0 - 1) * 100 : 0;
    return [
      ["Vốn ban đầu → cuối", cap0.toFixed(2) + " → " + Number(d.final_balance).toFixed(2), null],
      ["Lời / lỗ", money(d.total_pnl) + " USDT (" + money(ret) + "%)", d.total_pnl],
      ["Số lệnh", tr.length + " (LONG " + longs + " / SHORT " + (tr.length - longs) + ")", null],
      ["Thắng / thua", d.wins + " / " + d.losses + " — winrate " + d.winrate + "%", null],
      ["Drawdown lớn nhất", d.max_drawdown_pct + "%", -1],
      ["Profit factor", l.length && sum(l) < 0 ? (sum(w) / -sum(l)).toFixed(2) : "—", null],
      ["Lãi TB lệnh thắng", w.length ? money(sum(w) / w.length) : "—", 1],
      ["Lỗ TB lệnh thua", l.length ? money(sum(l) / l.length) : "—", -1],
      ["Chuỗi thua dài nhất", streak + " lệnh", null]
    ];
  }

  function drawChart(d) {
    var cv = $("btChart"), tip = $("btTip");
    var dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    var g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    var cap0 = Number(d.initial_capital || 0);
    var pts = [{t: ts(d.start), v: cap0, label: "Bắt đầu"}].concat((d.trades || []).map(function(x) {
      return {t: ts(x.exit_time), v: Number(x.capital_after), label: x.side + " " + x.exit_reason + " " + money(Number(x.profit) - Number(x.fee_in || 0))};
    }));
    var padL = 64, padR = 14, padT = 14, padB = 30;
    var t0 = pts[0].t, t1 = Math.max(ts(d.end), pts[pts.length - 1].t);
    var vs = pts.map(function(p) { return p.v; });
    var vmin = Math.min.apply(null, vs), vmax = Math.max.apply(null, vs);
    if (vmax - vmin < 1e-9) { vmax += 1; vmin -= 1; }
    var pad = (vmax - vmin) * 0.08; vmin -= pad; vmax += pad;
    var X = function(t) { return padL + (t - t0) / Math.max(1, t1 - t0) * (W - padL - padR); };
    var Y = function(v) { return padT + (vmax - v) / (vmax - vmin) * (H - padT - padB); };
    g.font = "11px sans-serif"; g.fillStyle = "#889"; g.strokeStyle = "#262640"; g.lineWidth = 1;
    for (var i = 0; i <= 4; i++) {
      var v = vmin + (vmax - vmin) * i / 4, y = Y(v);
      g.beginPath(); g.moveTo(padL, y); g.lineTo(W - padR, y); g.stroke();
      g.textAlign = "right"; g.fillText(v.toFixed(0), padL - 6, y + 4);
    }
    g.textAlign = "center";
    var nx = W < 600 ? 2 : 4;  // màn hình hẹp: ít nhãn ngày để không chồng chữ
    for (var j = 0; j <= nx; j++) {
      var tt = t0 + (t1 - t0) * j / nx;
      g.fillText(vn(tt, 10), Math.min(Math.max(X(tt), padL + 30), W - padR - 30), H - 10);
    }
    // đường vốn ban đầu
    g.setLineDash([4, 4]); g.strokeStyle = "#556"; g.beginPath(); g.moveTo(padL, Y(cap0)); g.lineTo(W - padR, Y(cap0)); g.stroke(); g.setLineDash([]);
    // đường vốn theo thời gian (bậc thang: vốn chỉ đổi khi đóng lệnh)
    var up = pts[pts.length - 1].v >= cap0;
    g.strokeStyle = up ? "#4c9" : "#e66"; g.lineWidth = 2; g.beginPath();
    pts.forEach(function(p, k) {
      if (k === 0) g.moveTo(X(p.t), Y(p.v));
      else { g.lineTo(X(p.t), Y(pts[k - 1].v)); g.lineTo(X(p.t), Y(p.v)); }
    });
    g.lineTo(X(t1), Y(pts[pts.length - 1].v)); g.stroke();
    cv.onmousemove = function(e) {
      var r = cv.getBoundingClientRect(), mx = e.clientX - r.left, best = null, bd = 1e9;
      pts.forEach(function(p) { var dd = Math.abs(X(p.t) - mx); if (dd < bd) { bd = dd; best = p; } });
      if (!best || bd > 30) { tip.style.display = "none"; return; }
      tip.textContent = vn(best.t, 16) + " — vốn " + best.v.toFixed(2) + " — " + best.label;
      tip.style.display = "block";
      tip.style.left = Math.min(mx + 12, W - tip.offsetWidth - 4) + "px"; tip.style.top = Math.max(Y(best.v) - 30, 2) + "px";
    };
    cv.onmouseleave = function() { tip.style.display = "none"; };
  }

  function openModal(d, jobId) {
    last = {d: d, jobId: jobId};
    $("btModalTitle").textContent = "Backtest PP" + d.method + " — " + d.symbol + " — " +
      String(d.start).slice(0, 10) + " → " + String(d.end).slice(0, 10);
    $("btStats").innerHTML = stats(d).map(function(s) {
      var c = s[2] == null ? "#dde" : (s[2] >= 0 ? "#6c6" : "#f77");
      return "<div class='bt-stat'><div class='k'>" + s[0] + "</div><div class='v' style='color:" + c + "'>" + s[1] + "</div></div>";
    }).join("");
    var reasons = Object.keys(d.exit_reasons || {}).map(function(k) { return k + ": " + d.exit_reasons[k]; }).join(" · ");
    $("btReasons").textContent = reasons ? "Lý do thoát lệnh — " + reasons : "Không có lệnh nào trong khoảng này.";
    $("btXlsx").href = "/api/backtest/job/" + jobId + "/xlsx";
    $("btModal").classList.add("open");
    $("btnBtReopen").style.display = "";
    drawChart(d);
  }
  function closeModal() { $("btModal").classList.remove("open"); }
  $("btClose").addEventListener("click", closeModal);
  $("btModal").addEventListener("click", function(e) { if (e.target === this) closeModal(); });
  document.addEventListener("keydown", function(e) { if (e.key === "Escape") closeModal(); });
  $("btnBtReopen").addEventListener("click", function() { if (last) openModal(last.d, last.jobId); });
  window.addEventListener("resize", function() { if (last && $("btModal").classList.contains("open")) drawChart(last.d); });

  function done(btn, res, d, jobId) {
    btn.disabled = false; btn.textContent = "Chạy backtest";
    if (d.error) { res.textContent = "Lỗi: " + d.error; res.style.color = "#f66"; return; }
    var reasons = Object.keys(d.exit_reasons || {}).map(function(k) { return k + " " + d.exit_reasons[k]; }).join(", ");
    res.style.color = "#9cf";
    res.textContent = [
      d.symbol + " — " + d.total_trades + " lệnh",
      "W/L: " + d.wins + "/" + d.losses + " (" + d.winrate + "%)",
      "PnL: " + (d.total_pnl >= 0 ? "+" : "") + d.total_pnl.toFixed(2),
      "Vốn cuối: " + d.final_balance.toFixed(2),
      "DD max: " + d.max_drawdown_pct + "%",
      reasons ? "Thoát: " + reasons : ""
    ].filter(Boolean).join(" | ");
    showTrades(d.trades);
    if (jobId) openModal(d, jobId);
  }

  function poll(jobId, btn, res) {
    fetch("/api/backtest/job/" + jobId).then(function(r) { return r.json(); }).then(function(d) {
      if (d.state === "running") {
        res.textContent = "Đang tải dữ liệu 1m và phát lại... " + d.elapsed_sec + "s (lần đầu có thể mất 1–3 phút)";
        setTimeout(function() { poll(jobId, btn, res); }, 2000);
      } else {
        done(btn, res, d, jobId);
      }
    }).catch(function() { setTimeout(function() { poll(jobId, btn, res); }, 4000); });
  }

  $("btnBacktest").addEventListener("click", function() {
    var btn = this, res = $("backtestResult");
    var capital = parseFloat($("btCapital").value);
    if (!$("btStartDate").value) { alert("Chọn ngày bắt đầu"); return; }
    if (!capital || capital <= 0) { alert("Vốn phải > 0"); return; }
    btn.disabled = true; btn.textContent = "Đang chạy...";
    res.textContent = "Đang gửi yêu cầu..."; res.style.color = "#fc6";
    $("backtestTrades").style.display = "none";
    fetch(API + "/backtest", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        symbol: $("btSymbol").value.trim(), start_date: $("btStartDate").value,
        end_date: $("btEndDate").value, initial_capital: capital
      })
    }).then(function(r) { return r.json(); }).then(function(d) {
      if (d.error) { done(btn, res, d); return; }
      poll(d.job_id, btn, res);
    }).catch(function(e) { done(btn, res, {error: "Lỗi kết nối: " + e}); });
  });
})();
</script>
